name: Playwright Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Run Playwright Dual-Engine Test Suite
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      options: --ipc=host

    env:
      CI: true
      HEADLESS: true
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL || 'https://www.saucedemo.com' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Bun Runtime Environment
        run: npm install -g bun
        # uses: oven-sh/setup-bun@v2
        # with:
        #   bun-version: latest

      - name: Install Project Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run ESLint Code Analysis
        run: bun run lint

      - name: Run Playwright API Tests
        run: bun run test:api

      - name: Run Playwright Web UI Tests
        run: bun run test:e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results & Traces
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
