name: Playwright Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Dual-Engine Test Suite
    timeout-minutes: 20
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ticket_booking
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql,tmpfs-size=1073741824
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --mount type=tmpfs,destination=/data,tmpfs-size=536870912
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Playwright Test Suite
        uses: actions/checkout@v4
        with:
          path: software-testing-playwright

      - name: Checkout Backend Service (ngxccc/ticket-booking)
        id: checkout_backend
        uses: actions/checkout@v4
        with:
          repository: ngxccc/ticket-booking
          path: ticket-booking

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Backend Dependencies & Seed Test Database
        working-directory: ticket-booking
        env:
          DB_DATABASE: ticket_booking
          DB_HOST: localhost
          DB_LOGGING: "false"
          DB_MIGRATIONS_RUN: "false"
          DB_PASSWORD: postgrespassword
          DB_PORT: "5432"
          DB_SYNCHRONIZE: "true"
          DB_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
          DB_USERNAME: postgres
          DOMAIN_NAME: http://127.0.0.1:3000
          FRONTEND_URL: http://127.0.0.1:3000
          TARGET_URL: http://127.0.0.1:3000
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          JWT_SECRET: skibiditoilet-tungtungshahu-@369-the-best-secrect
          LOG_LEVEL: debug
          NODE_ENV: test
          PAYOS_API_KEY: mock_api_key
          PAYOS_CHECKSUM_KEY: mock_checksum_key
          PAYOS_CLIENT_ID: mock_client_id
          PORT: "3000"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_URL: redis://localhost:6379
          RESEND_API_KEY: re_dummy_key_for_staging_testing_123456789
          EMAIL_FROM: Ticket Booking <support@ticketbooking.ngxc.io.vn>
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: test
          SENTRY_TRACES_SAMPLE_RATE: "1.0"
          SHOW_CREATION_MIN_LEAD_MINUTES: "10"
          VUS: "500"
        run: |
          bun install --frozen-lockfile || bun install
          bunx drizzle-kit push --config drizzle.config.ts
          bun src/database/seeds/index.ts --reset

      - name: Start Backend Server
        working-directory: ticket-booking
        env:
          DB_DATABASE: ticket_booking
          DB_HOST: localhost
          DB_LOGGING: "false"
          DB_MIGRATIONS_RUN: "false"
          DB_PASSWORD: postgrespassword
          DB_PORT: "5432"
          DB_SYNCHRONIZE: "true"
          DB_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
          DB_USERNAME: postgres
          DOMAIN_NAME: http://127.0.0.1:3000
          FRONTEND_URL: http://127.0.0.1:3000
          TARGET_URL: http://127.0.0.1:3000
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          JWT_SECRET: skibiditoilet-tungtungshahu-@369-the-best-secrect
          LOG_LEVEL: debug
          NODE_ENV: test
          PAYOS_API_KEY: mock_api_key
          PAYOS_CHECKSUM_KEY: mock_checksum_key
          PAYOS_CLIENT_ID: mock_client_id
          PORT: "3000"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_URL: redis://localhost:6379
          RESEND_API_KEY: re_dummy_key_for_staging_testing_123456789
          EMAIL_FROM: Ticket Booking <support@ticketbooking.ngxc.io.vn>
          SENTRY_DSN: ""
          SENTRY_ENVIRONMENT: test
          SENTRY_TRACES_SAMPLE_RATE: "1.0"
          SHOW_CREATION_MIN_LEAD_MINUTES: "10"
          VUS: "500"
        run: |
          cat << 'EOF' > start-server.ts
          import { Test } from "@nestjs/testing";
          import { AppModule } from "./src/app.module";
          import { ZodValidationPipe } from "./src/common/pipes/zod-validation.pipe";

          async function bootstrap() {
            const moduleFixture = await Test.createTestingModule({
              imports: [AppModule],
            }).compile();

            const app = moduleFixture.createNestApplication();
            app.useGlobalPipes(new ZodValidationPipe());
            await app.listen(Number(process.env.PORT) || 3000);
            console.log("NestJS Test Server listening on http://127.0.0.1:3000");
          }
          void bootstrap();
          EOF

          bun run start-server.ts &
          bunx wait-on http://127.0.0.1:3000/ --timeout 60000

      - name: Install Playwright Dependencies & Browsers
        working-directory: software-testing-playwright
        run: |
          bun install --frozen-lockfile || bun install
          bunx playwright install --with-deps chromium

      - name: Run TypeScript Typecheck
        working-directory: software-testing-playwright
        run: bun run typecheck

      - name: Run ESLint Code Analysis
        working-directory: software-testing-playwright
        run: bun run lint

      - name: Run Playwright API Tests (Against Local Ephemeral Backend)
        working-directory: software-testing-playwright
        env:
          API_BASE_URL: http://127.0.0.1:3000
          CI: true
        run: bun run test:api

      - name: Run Playwright Web UI Tests (SauceDemo E2E)
        working-directory: software-testing-playwright
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL || 'https://www.saucedemo.com' }}
          CI: true
        run: bun run test:e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: software-testing-playwright/playwright-report/
          retention-days: 14

      - name: Upload Test Results & Traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: software-testing-playwright/test-results/
          retention-days: 14
