name: Playwright Automation CI

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Test Suite & Quality Checks (Bun)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Project Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run ESLint Code Analysis
        run: bun run lint

      - name: Install Playwright Browsers & OS Dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests (Chromium)
        run: bun run test:e2e
        env:
          CI: true
          WEB_BASE_URL: https://www.saucedemo.com

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results & Traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
