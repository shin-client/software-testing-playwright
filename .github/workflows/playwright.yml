name: Playwright Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Dual-Engine Test Suite
    timeout-minutes: 20
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ticket_booking
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql,tmpfs-size=1073741824
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --mount type=tmpfs,destination=/data,tmpfs-size=536870912
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Playwright Test Suite
        uses: actions/checkout@v4
        with:
          path: software-testing-playwright

      - name: Checkout Backend Service (ngxccc/ticket-booking)
        id: checkout_backend
        uses: actions/checkout@v4
        with:
          repository: ngxccc/ticket-booking
          path: ticket-booking

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Export Unified Environment Variables (.env.test)
        run: |
          cat software-testing-playwright/.env.test >> $GITHUB_ENV

      - name: Install Backend Dependencies & Seed Test Database
        working-directory: ticket-booking
        run: |
          bun install --frozen-lockfile || bun install
          bunx drizzle-kit push --config drizzle.config.ts
          bun src/database/seeds/index.ts --reset

      - name: Start Ephemeral Backend Server
        working-directory: ticket-booking
        run: |
          cat << 'EOF' > test/standalone-server.spec.ts
          import { test } from "bun:test";
          import { Test } from "@nestjs/testing";
          import { AppModule } from "../src/app.module";
          import { ZodValidationPipe } from "../src/common/pipes/zod-validation.pipe";

          test("launch-standalone-backend-server", async () => {
            const moduleFixture = await Test.createTestingModule({
              imports: [AppModule],
            }).compile();

            const app = moduleFixture.createNestApplication();
            app.useGlobalPipes(new ZodValidationPipe());
            await app.listen(Number(process.env.PORT) || 3000);
            console.log("NestJS Test Server listening on http://127.0.0.1:3000");

            // Keep the server process alive indefinitely for incoming Playwright requests
            await new Promise(() => {});
          }, { timeout: 0 });
          EOF

          bun test ./test/standalone-server.spec.ts &
          bunx wait-on http://127.0.0.1:3000/ --timeout 60000

      - name: Install Playwright Dependencies & Browsers
        working-directory: software-testing-playwright
        run: |
          bun install --frozen-lockfile || bun install
          bunx playwright install --with-deps chromium

      - name: Run TypeScript Typecheck
        working-directory: software-testing-playwright
        run: bun run typecheck

      - name: Run ESLint Code Analysis
        working-directory: software-testing-playwright
        run: bun run lint

      - name: Run Playwright API Tests (Against Local Ephemeral Backend)
        working-directory: software-testing-playwright
        env:
          CI: true
        run: bun run test:api

      - name: Run Playwright Web UI Tests (SauceDemo E2E)
        working-directory: software-testing-playwright
        env:
          CI: true
        run: bun run test:e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: software-testing-playwright/playwright-report/
          retention-days: 14

      - name: Upload Test Results & Traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: software-testing-playwright/test-results/
          retention-days: 14
