name: Playwright Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Dual-Engine Test Suite
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Playwright Test Suite
        uses: actions/checkout@v7

      - name: Export Unified Environment Variables (.env.test)
        run: |
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.test >> $GITHUB_ENV

      - name: Start Full Test Environment
        run: |
          docker compose up -d --wait

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright Dependencies & Browsers
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run ESLint Code Analysis
        run: bun run lint

      - name: Run Playwright API Tests
        env:
          CI: true
        run: bun run test:api

      - name: Run Playwright Web UI Tests (SauceDemo E2E)
        env:
          CI: true
        run: bun run test:e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results & Traces
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
