name: Playwright Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Dual-Engine Test Suite
    timeout-minutes: 20
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ticket_booking
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql,tmpfs-size=1073741824
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --mount type=tmpfs,destination=/data,tmpfs-size=536870912
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Playwright Test Suite
        uses: actions/checkout@v4
        with:
          path: software-testing-playwright

      - name: Checkout Backend Service (ticket-booking)
        uses: actions/checkout@v4
        with:
          repository: shin-client/ticket-booking
          path: ticket-booking
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Backend Dependencies & Seed Test Database
        working-directory: ticket-booking
        env:
          DB_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_SECRET: super-secret-jwt-key-minimum-32-chars-long
          JWT_REFRESH_SECRET: super-secret-refresh-jwt-key-minimum-32-chars-long
        run: |
          bun install --frozen-lockfile || bun install
          bunx drizzle-kit push --config drizzle.config.ts
          bun src/database/seeds/index.ts --reset

      - name: Start Backend Server
        working-directory: ticket-booking
        env:
          DB_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ticket_booking?sslmode=disable
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: 3000
          JWT_SECRET: super-secret-jwt-key-minimum-32-chars-long
          JWT_REFRESH_SECRET: super-secret-refresh-jwt-key-minimum-32-chars-long
        run: |
          bun run src/main.ts &
          bunx wait-on http://127.0.0.1:3000/ --timeout 60000

      - name: Install Playwright Dependencies & Browsers
        working-directory: software-testing-playwright
        run: |
          bun install --frozen-lockfile || bun install
          bunx playwright install --with-deps chromium

      - name: Run TypeScript Typecheck
        working-directory: software-testing-playwright
        run: bun run typecheck

      - name: Run ESLint Code Analysis
        working-directory: software-testing-playwright
        run: bun run lint

      - name: Run Playwright API Tests (Against Local Ephemeral Backend)
        working-directory: software-testing-playwright
        env:
          API_BASE_URL: http://127.0.0.1:3000
          CI: true
        run: bun run test:api

      - name: Run Playwright Web UI Tests (SauceDemo E2E)
        working-directory: software-testing-playwright
        env:
          WEB_BASE_URL: https://www.saucedemo.com
          CI: true
        run: bun run test:e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: software-testing-playwright/playwright-report/
          retention-days: 14

      - name: Upload Test Results & Traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: software-testing-playwright/test-results/
          retention-days: 14
