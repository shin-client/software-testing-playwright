services:
  postgres:
    image: postgres:18-alpine
    container_name: ticket_booking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ticket_booking
    ports:
      - "5432:5432"
    volumes:
      # Tự động nạp schema & toàn bộ dữ liệu seed chuẩn khi khởi tạo container lần đầu
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    tmpfs:
      - /var/lib/postgresql:size=1073741824
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: ticket_booking_redis
    ports:
      - "6379:6379"
    tmpfs:
      - /data:size=536870912
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/ngxccc/ticket-booking:latest
    container_name: ticket_booking_backend
    env_file:
      - .env.test
    environment:
      # Override DB & Redis host để container backend trỏ đúng tới container postgres & redis trong cùng docker network
      DB_HOST: postgres
      REDIS_HOST: redis
      DB_URL: postgresql://postgres:postgrespassword@postgres:5432/ticket_booking?sslmode=disable
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/ticket_booking?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
